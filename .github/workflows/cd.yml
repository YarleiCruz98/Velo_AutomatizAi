name: Continuous Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Run unit tests
        run: yarn test:unit

  sync-supabase-preview:
    name: Sync Supabase Preview
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Apply preview migrations
        env:
          PREVIEW_DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
        run: yarn supabase db push --db-url "$PREVIEW_DATABASE_URL" --yes

      - name: Deploy preview Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PREVIEW_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF_PREVIEW }}
        run: yarn supabase functions deploy --project-ref "$PREVIEW_PROJECT_REF"

  build-preview:
    name: Build and Deploy Preview
    needs: sync-supabase-preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Pull Vercel Preview configuration
        run: >-
          yarn vercel pull --yes --environment=preview
          --token="$VERCEL_TOKEN"

      - name: Build Preview
        run: yarn vercel build --token="$VERCEL_TOKEN"

      - name: Verify Preview bundle target
        env:
          EXPECTED_URL: ${{ vars.SUPABASE_URL_PREVIEW }}
          FORBIDDEN_URL: ${{ vars.SUPABASE_URL_PRODUCTION }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_URL"
          test -n "$FORBIDDEN_URL"
          test "$EXPECTED_URL" != "$FORBIDDEN_URL"
          test -d .vercel/output/static
          grep -rqF "$EXPECTED_URL" .vercel/output/static
          if grep -rqF "$FORBIDDEN_URL" .vercel/output/static; then
            echo "::error::Preview bundle contains the production Supabase URL"
            exit 1
          fi

      - name: Deploy Preview
        id: deploy
        run: |
          URL=$(yarn --silent vercel deploy --prebuilt --target=preview --token="$VERCEL_TOKEN")
          echo "deployment-url=$URL" >> "$GITHUB_OUTPUT"

  e2e-tests:
    name: E2E Tests on Preview
    needs: build-preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Chromium
        run: yarn playwright install --with-deps chromium

      - name: Run Playwright regression tests
        run: yarn playwright test --project=chromium
        env:
          BASE_URL: ${{ needs.build-preview.outputs.deployment-url }}
          DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
          SUPABASE_PROJECT_REF_PREVIEW: ${{ vars.SUPABASE_PROJECT_REF_PREVIEW }}
          SUPABASE_PROJECT_REF_PRODUCTION: ${{ vars.SUPABASE_PROJECT_REF_PRODUCTION }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Publish TestDino report
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npx tdpw upload ./playwright-report --token="${{ secrets.TD_TOKEN }}"

  sync-supabase-production:
    name: Sync Supabase Production
    needs: e2e-tests
    if: >-
      ${{ github.event_name != 'pull_request'
      && vars.ENABLE_PRODUCTION_DB_SYNC == 'true' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Apply production migrations
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: yarn supabase db push --db-url "$PRODUCTION_DATABASE_URL" --yes

      - name: Deploy production Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF_PRODUCTION }}
        run: yarn supabase functions deploy --project-ref "$PRODUCTION_PROJECT_REF"

  deploy-production:
    name: Build and Deploy Production
    needs: [build-preview, e2e-tests, sync-supabase-production]
    if: >-
      ${{ !cancelled()
      && github.event_name != 'pull_request'
      && needs.build-preview.result == 'success'
      && needs.e2e-tests.result == 'success'
      && (needs.sync-supabase-production.result == 'success'
      || needs.sync-supabase-production.result == 'skipped') }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Pull Vercel Production configuration
        run: >-
          yarn vercel pull --yes --environment=production
          --token="$VERCEL_TOKEN"

      - name: Build Production
        run: yarn vercel build --prod --token="$VERCEL_TOKEN"

      - name: Verify Production bundle target
        env:
          EXPECTED_URL: ${{ vars.SUPABASE_URL_PRODUCTION }}
          FORBIDDEN_URL: ${{ vars.SUPABASE_URL_PREVIEW }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_URL"
          test -n "$FORBIDDEN_URL"
          test "$EXPECTED_URL" != "$FORBIDDEN_URL"
          test -d .vercel/output/static
          grep -rqF "$EXPECTED_URL" .vercel/output/static
          if grep -rqF "$FORBIDDEN_URL" .vercel/output/static; then
            echo "::error::Production bundle contains the preview Supabase URL"
            exit 1
          fi

      - name: Deploy Production
        run: yarn vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
